<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Trainer</title><meta name="robots" content="noindex">
<!-- OPTIONAL. Only needed if you set PRETTY=true in index.html.
     GitHub Pages shows this file for any address that doesn't exist, e.g. tables.mobiledoctor.org.in/rahul.
     It forwards the visitor to the app's public-page address: /#/rahul -->
<script>
(function(){
  var m=location.pathname.match(/^\/@?([A-Za-z][A-Za-z0-9_]{2,23})\/?$/);
  location.replace(m?"/#/"+m[1].toLowerCase():"/");
})();
</script></head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:40px">
<p>Opening Table Trainer… <a href="/">Tap here if nothing happens</a></p>
</body></html>
